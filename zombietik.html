<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🧟 ZOMBIE-TIK — een spel van Claude</title>
<link rel="stylesheet" href="spel-stijl.css">
<style>
  #veld {
    position:fixed; inset:0; display:grid; place-content:center;
    grid-template-columns:repeat(3, min(26vw, 150px)); gap:min(4vw, 22px);
  }
  .gat {
    width:min(26vw,150px); height:min(26vw,150px); border-radius:22px; cursor:pointer;
    background:radial-gradient(circle at 50% 70%, #1a1f3d, #0b0e21);
    border:2px solid rgba(59,130,246,0.35);
    display:flex; align-items:center; justify-content:center;
    font-size:min(15vw,84px); user-select:none; -webkit-user-select:none;
  }
  .gat .wie { transform:scale(0); transition:transform 0.12s; pointer-events:none; }
  .gat.op .wie { transform:scale(1); }
  .gat.raak { border-color:#ffd700; }
  #tijdBalk { position:fixed; top:0; left:0; height:7px; background:linear-gradient(90deg,#ff3b3b,#3b82ff); width:100%; z-index:6; transition:width 0.2s linear; }
</style>
</head>
<body>
<a class="home" href="index.html">← deluxeedition.nl</a>
<div id="tijdBalk" class="verborgen"></div>
<div id="hud" class="verborgen">0</div>
<div id="veld"></div>

<div class="paneel" id="startPaneel">
  <h1>🧟 ZOMBIE-TIK</h1>
  <div class="sub">een spel van Claude 🤖 — ✏️ afstelbaar door Arthur</div>
  <div class="uitleg" id="uitlegTekst"></div>
  <button class="knop" id="startKnop">🧟 START</button>
  <div class="rij" style="margin-top:16px">Beste score: <b id="bestStart">0</b></div>
</div>

<div class="paneel verborgen" id="doodPaneel">
  <h1 style="font-size:clamp(28px,6vw,46px)">⏰ TIJD IS OM!</h1>
  <div class="score-groot" id="doodScore">0</div>
  <div class="rij" id="doodBest"></div>
  <div class="rij" id="doodKeys"></div>
  <button class="knop" id="nogEenKeer" style="margin-top:20px">🔁 NOG EEN KEER</button>
</div>

<script src="spel-basis.js"></script>
<script>
// ── instellingen (Arthur mag hieraan draaien) ──
const STANDAARD = { speeltijd: 45, spawnTempo: 900, opTijd: 1100, bomKans: 15, zombie: "🧟", bom: "💣" };
let INSTEL = { ...STANDAARD };
function uitleg() {
  document.getElementById("uitlegTekst").innerHTML =
    "Tik de " + INSTEL.zombie + " zombies zo snel je kan — elke zombie = 1 punt = 1 🗝️ key!<br>" +
    "Maar tik NIET op de " + INSTEL.bom + " — die kost je 3 punten.<br>" +
    "Je hebt <b>" + INSTEL.speeltijd + " seconden</b>. Klaar voor de start?";
}
editorKlaar("zombietik", [
  { sleutel: "speeltijd", label: "⏰ Speeltijd (seconden)", soort: "schuif", min: 20, max: 90, stap: 5 },
  { sleutel: "spawnTempo", label: "⚡ Hoe snel komen ze? (ms — lager = sneller)", soort: "schuif", min: 400, max: 1500, stap: 50 },
  { sleutel: "opTijd", label: "👀 Hoe lang blijven ze staan? (ms)", soort: "schuif", min: 500, max: 2500, stap: 100 },
  { sleutel: "bomKans", label: "💣 Kans op een bom (%)", soort: "schuif", min: 0, max: 40, stap: 5 },
  { sleutel: "zombie", label: "🧟 Monster-emoji", soort: "tekst", maxLen: 4 },
  { sleutel: "bom", label: "💣 niet-tikken-emoji", soort: "tekst", maxLen: 4 },
], STANDAARD, (waarden) => { INSTEL = waarden; uitleg(); });
uitleg();

// ── het veld: 9 gaten ──
const veld = document.getElementById("veld");
const gaten = [];
for (let i = 0; i < 9; i++) {
  const g = document.createElement("div");
  g.className = "gat";
  g.innerHTML = "<span class='wie'></span>";
  veld.appendChild(g);
  gaten.push({ el: g, wie: null, weg: 0 });
  g.addEventListener("pointerdown", () => tik(i));
}

let stand = "start", score = 0, tijdOver = 0, spawnKlok, tijdKlok;

function tik(i) {
  if (stand !== "spel") return;
  const g = gaten[i];
  if (!g.wie) return;
  if (g.wie === "zombie") {
    score++;
    g.el.classList.add("raak");
    setTimeout(() => g.el.classList.remove("raak"), 150);
  } else {
    score = Math.max(0, score - 3);
    document.body.style.background = "#3a0a0a";
    setTimeout(() => { document.body.style.background = ""; }, 180);
  }
  verberg(i);
  document.getElementById("hud").textContent = score;
}

function verberg(i) {
  const g = gaten[i];
  g.wie = null;
  g.el.classList.remove("op");
}

function spawn() {
  if (stand !== "spel") return;
  const vrij = gaten.map((g, i) => g.wie ? -1 : i).filter(i => i >= 0);
  if (vrij.length) {
    const i = vrij[Math.floor(Math.random() * vrij.length)];
    const g = gaten[i];
    g.wie = Math.random() * 100 < INSTEL.bomKans ? "bom" : "zombie";
    g.el.querySelector(".wie").textContent = g.wie === "bom" ? INSTEL.bom : INSTEL.zombie;
    g.el.classList.add("op");
    clearTimeout(g.weg);
    g.weg = setTimeout(() => verberg(i), INSTEL.opTijd);
  }
  spawnKlok = setTimeout(spawn, INSTEL.spawnTempo * (0.75 + Math.random() * 0.5));
}

function startSpel() {
  stand = "spel"; score = 0; tijdOver = INSTEL.speeltijd;
  gaten.forEach((g, i) => verberg(i));
  document.getElementById("startPaneel").classList.add("verborgen");
  document.getElementById("doodPaneel").classList.add("verborgen");
  document.getElementById("hud").classList.remove("verborgen");
  document.getElementById("hud").textContent = "0";
  document.getElementById("tijdBalk").classList.remove("verborgen");
  spawn();
  clearInterval(tijdKlok);
  tijdKlok = setInterval(() => {
    tijdOver--;
    document.getElementById("tijdBalk").style.width = (tijdOver / INSTEL.speeltijd * 100) + "%";
    if (tijdOver <= 0) klaar();
  }, 1000);
}

function klaar() {
  stand = "dood";
  clearTimeout(spawnKlok); clearInterval(tijdKlok);
  gaten.forEach((g, i) => verberg(i));
  const best = zetRecord("deluxe-zombietik-best", score);
  const keys = geefKeys(score, "zombietik");
  document.getElementById("doodScore").textContent = score + " zombies";
  document.getElementById("doodBest").innerHTML = "Beste score: <b>" + best + "</b>" + (score >= best && score > 0 ? " 🏆 NIEUW RECORD!" : "");
  document.getElementById("doodKeys").innerHTML = keysTekst(keys);
  document.getElementById("doodPaneel").classList.remove("verborgen");
  document.getElementById("hud").classList.add("verborgen");
  document.getElementById("tijdBalk").classList.add("verborgen");
}

document.getElementById("startKnop").addEventListener("click", startSpel);
document.getElementById("nogEenKeer").addEventListener("click", startSpel);
document.getElementById("bestStart").textContent = localStorage.getItem("deluxe-zombietik-best") || "0";
</script>
</body>
</html>
