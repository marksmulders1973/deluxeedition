<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c8102e">
<title>DOBBELEN — Deluxe Edition</title>
<style>
  /* 🎲 DOBBELEN — stap 2 (10 nov 2026, Brian): na de knop DOBBELEN kom je op een rood scherm.
     Stap 3 (10 nov): op het scherm staat alleen een dobbelsteen.
     Stap 4 (10 nov): klik erop en hij rolt, en blijft dan op een toevallig getal liggen.
     Stap 5 (10 nov): boven de steen staat wie er aan de beurt is; na elke worp is de volgende naam uit de lijst. */
  html, body { margin: 0; height: 100%; background: #c8102e; }
  /* Stap 6 (10 nov): dezelfde kerstversiering als bij de namen (dobbelen-kerst.js): slingers, hangende ballen, kerstboom. */
  #decor { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  #ballen { position: fixed; top: 0; left: 0; width: 100%; height: 0; z-index: 0; pointer-events: none; }
  #ballen .bal { position: absolute; top: 0; transform-origin: 50% 0; animation: wieg 4s ease-in-out infinite alternate; }
  @keyframes wieg { from { transform: rotate(-3.2deg); } to { transform: rotate(3.2deg); } }
  @media (prefers-reduced-motion: reduce) { #ballen .bal { animation: none; } }
  #beurt, #steen, #zelf, #zelfKnop { position: relative; z-index: 2; }
  /* Stap 7 (10 nov): knop "zelf dobbelen" onderin. Dan verdwijnt de steen, staat er "Je dobbelt zelf" en ga je met VERDER naar de volgende. */
  .knop { font: inherit; font-weight: 800; letter-spacing: 1px; border: 0; border-radius: 14px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .knop:active { transform: translateY(3px); }
  #zelfKnop { position: fixed; left: 50%; bottom: 22px; translate: -50% 0; font-size: 16px; padding: 12px 22px; color: #8f0b20;
              background: #fff; box-shadow: 0 4px 0 #6d0716; white-space: nowrap; }
  #zelfKnop:active { box-shadow: 0 1px 0 #6d0716; }
  #zelf { display: none; flex-direction: column; align-items: center; gap: 26px; min-height: min(56vw, 44vh, 320px); justify-content: center; padding: 0 16px; }
  #zelf .tekst { font-size: clamp(26px, 7vw, 42px); font-weight: 800; text-shadow: 0 3px 0 rgba(77,6,18,.45); }
  #verder { font-size: 22px; padding: 16px 44px; color: #fff; background: #146b3a; box-shadow: 0 5px 0 #0c4a27; }
  #verder:active { box-shadow: 0 1px 0 #0c4a27; }
  body.zelf #steen, body.zelf #zelfKnop { display: none; }
  /* Stap 8 (10 nov): bij een zes wordt het scherm goud, met "Pak een cadeau" en onderin "Merry Christmas". Tik om verder te gaan. */
  #cadeau, #merry { display: none; position: relative; z-index: 2; color: #8f0b20; font-weight: 900; }
  #cadeau { font-size: clamp(30px, 8vw, 54px); line-height: 1.05; text-shadow: 0 2px 0 rgba(255,255,255,.55); padding: 0 16px; animation: nieuw .45s ease-out; }
  #merry { position: fixed; left: 0; right: 0; bottom: 20px; font-size: clamp(22px, 6vw, 34px); font-style: italic; letter-spacing: 1px; text-shadow: 0 2px 0 rgba(255,255,255,.55); }
  /* Stap 12 (10 nov): alle cadeautjes op = groen scherm met dezelfde versiering.
     Stap 13 (10 nov): op het groene scherm gaat het spel gewoon door: dobbelsteen, zelf dobbelen en het gouden scherm bij een zes. */
  html.groen, body.groen { background: #146b3a; }
  body.groen #zelfKnop { color: #0c4a27; box-shadow: 0 4px 0 #07361b; }
  body.groen #cadeauTeller { color: #0c4a27; box-shadow: 0 3px 0 rgba(7,54,27,.6); }
  body.groen #beurt .naam, body.groen #zelf .tekst { text-shadow: 0 3px 0 rgba(7,54,27,.6); }
  body.groen #verder { background: #c8102e; box-shadow: 0 5px 0 #8f0b20; }
  /* Stap 15 (10 nov): timer om = hard alarm + de kerstman zegt "HO HO HO HO VEEL CADEAUTJES HE FIJNE KERSTFEEST". */
  #alarm { display: none; position: fixed; inset: 0; z-index: 5; flex-direction: column; align-items: center; justify-content: center; gap: 2vh;
           padding: 110px 16px 30px; background: rgba(12,74,39,.84); color: #fff; font-weight: 900; cursor: pointer; }
  #alarm.aan { display: flex; animation: flits .5s steps(2) infinite; }
  #alarm .hoho { font-size: clamp(40px, 12vw, 110px); line-height: 1; color: #f3e3a6; text-shadow: 0 5px 0 #8f0b20; animation: schud .28s linear infinite; }
  #alarm .regel { font-size: clamp(26px, 7vw, 60px); line-height: 1.1; text-shadow: 0 4px 0 rgba(7,54,27,.7); }
  @keyframes flits { from { background: rgba(12,74,39,.84); } to { background: rgba(200,16,46,.84); } }
  @keyframes schud { 0% { transform: rotate(-2deg) scale(1); } 50% { transform: rotate(2deg) scale(1.05); } 100% { transform: rotate(-2deg) scale(1); } }
  @media (prefers-reduced-motion: reduce) { #alarm.aan, #alarm .hoho { animation: none; } }
  html.goud, body.goud { background: #e3b93a; }
  body.goud { background: radial-gradient(circle at 50% 38%, #fff3b8 0%, #f1cd55 38%, #d4a321 100%); gap: 3vh; cursor: pointer; }
  body.goud #cadeau, body.goud #merry { display: block; }
  body.goud #zelfKnop { display: none; }
  body.goud #steen { width: min(46vw, 32vh, 260px); }
  body.goud #beurt .klein { color: #8f0b20; }
  body.goud #beurt .naam { color: #8f0b20; text-shadow: 0 2px 0 rgba(255,255,255,.55); }
  body.zelf #zelf { display: flex; }
  body { box-sizing: border-box; padding-top: 104px; padding-bottom: 78px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3.5vh;
         font-family: "Segoe UI", system-ui, sans-serif; color: #fff; text-align: center; }
  #beurt { min-height: 92px; padding: 0 16px; }
  /* Stap 10 (10 nov): bovenaan staat hoeveel cadeautjes er zijn (het aantal dat bij de namen is ingevuld). */
  #cadeauTeller { display: inline-block; margin-bottom: 14px; padding: 6px 16px; border-radius: 999px; font-size: 17px; font-weight: 800;
                  color: #8f0b20; background: #fff; box-shadow: 0 3px 0 rgba(77,6,18,.45); }
  #cadeauTeller:empty { display: none; }
  #beurt .klein { font-size: 15px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: #f3e3a6; }
  #beurt .naam { font-size: clamp(34px, 9vw, 60px); font-weight: 900; line-height: 1.1; margin-top: 4px; overflow-wrap: anywhere;
                 text-shadow: 0 3px 0 rgba(77,6,18,.45); }
  #beurt.wissel .naam { animation: nieuw .45s ease-out; }
  @keyframes nieuw { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #steen { width: min(56vw, 38vh, 320px); height: auto; display: block; cursor: pointer; overflow: visible;
           -webkit-tap-highlight-color: transparent; user-select: none; }
  #steen.rolt { animation: rol 1.1s cubic-bezier(.3,.1,.3,1); }
  @keyframes rol {
    0%   { transform: translateY(0) rotate(0) scale(1); }
    20%  { transform: translateY(-34%) rotate(200deg) scale(1.08); }
    40%  { transform: translateY(0) rotate(400deg) scale(.96); }
    58%  { transform: translateY(-16%) rotate(560deg) scale(1.04); }
    76%  { transform: translateY(0) rotate(680deg) scale(.98); }
    88%  { transform: translateY(-5%) rotate(712deg) scale(1.01); }
    100% { transform: translateY(0) rotate(720deg) scale(1); }
  }
</style>
</head>
<body data-boom="vaag">
<div id="ballen" aria-hidden="true"></div>
<canvas id="decor" aria-hidden="true"></canvas>
<div id="beurt" aria-live="polite"><div id="cadeauTeller"></div><div class="klein"></div><div class="naam"></div></div>
<div id="cadeau">Pak een cadeau</div>
<svg id="steen" viewBox="0 0 200 200" role="img" aria-label="dobbelsteen">
  <defs>
    <linearGradient id="vlak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#f4f1ec"/>
      <stop offset="1" stop-color="#d9d3ca"/>
    </linearGradient>
    <radialGradient id="oog" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </radialGradient>
    <filter id="schaduw" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#4d0612" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect x="22" y="18" width="156" height="156" rx="30" fill="url(#vlak)" filter="url(#schaduw)"/>
  <rect x="27" y="23" width="146" height="146" rx="26" fill="none" stroke="#ffffff" stroke-width="3" opacity=".8"/>
  <g id="ogen" fill="url(#oog)"></g>
</svg>
<div id="zelf"><div class="tekst">Je dobbelt zelf</div><button class="knop" id="verder">VERDER</button></div>
<button class="knop" id="zelfKnop">ZELF DOBBELEN</button>
<div id="merry">Merry Christmas</div>
<div id="alarm" role="alert"><div class="hoho">HO HO HO HO</div><div class="regel">VEEL CADEAUTJES HÈ</div><div class="regel">FIJNE KERSTFEEST</div></div>
<script>
// Waar de ogen staan bij elk getal (de steen is 200 bij 200).
const L = 64, M = 100, R = 136, B = 60, C = 96, O = 132;
const OGEN = {
  1: [[M, C]],
  2: [[L, B], [R, O]],
  3: [[L, B], [M, C], [R, O]],
  4: [[L, B], [R, B], [L, O], [R, O]],
  5: [[L, B], [R, B], [M, C], [L, O], [R, O]],
  6: [[L, B], [R, B], [L, C], [R, C], [L, O], [R, O]]
};
const steen = document.getElementById('steen'), ogen = document.getElementById('ogen');
let getal = 5, bezig = false;

// De namen uit stap 1 (bewaard op dit apparaat). Wie aan de beurt is gaat de lijst af, en daarna weer van voren.
let namen = [];
try { namen = JSON.parse(localStorage.getItem('deluxe-dobbelen-namen') || '[]') || []; } catch (e) { namen = []; }
if (!Array.isArray(namen)) namen = [];
namen = namen.filter((n) => typeof n === 'string' && n.trim());
const beurtVak = document.getElementById('beurt');
let beurt = 0;
function toonBeurt() {
  beurtVak.querySelector('.klein').textContent = namen.length ? 'Aan de beurt' : 'Nog geen namen ingevuld';
  beurtVak.querySelector('.naam').textContent = namen.length ? namen[beurt] : ''; // textContent: een naam kan nooit als code worden uitgevoerd
  beurtVak.classList.remove('wissel'); void beurtVak.offsetWidth; beurtVak.classList.add('wissel');
}

function toon(n) {
  getal = n;
  ogen.innerHTML = OGEN[n].map(([x, y]) => '<circle cx="' + x + '" cy="' + y + '" r="14"/>').join('');
  steen.setAttribute('aria-label', 'dobbelsteen: ' + n);
}
function gooi() { return 1 + Math.floor(Math.random() * 6); }

function rol() {
  if (bezig) return;
  bezig = true;
  const uitkomst = gooi();
  steen.classList.remove('rolt'); void steen.getBoundingClientRect(); steen.classList.add('rolt');
  // tijdens het rollen springt hij langs andere getallen
  const wissel = setInterval(() => { let n; do { n = gooi(); } while (n === getal); toon(n); }, 90);
  setTimeout(() => { clearInterval(wissel); toon(uitkomst); }, 900);
  setTimeout(() => {
    steen.classList.remove('rolt');
    if (uitkomst === 6) { goudAan(); return; } // zes: goud scherm, wacht op een tik
    if (!namen.length) { bezig = false; return; }
    // even laten zien wat er gegooid is, dan is de volgende aan de beurt
    setTimeout(() => { beurt = (beurt + 1) % namen.length; toonBeurt(); bezig = false; }, 1300);
  }, 1120);
}

steen.addEventListener('click', rol);

// Een zes: het scherm wordt goud ("Pak een cadeau"). Een tik ergens op het scherm = terug naar rood en de volgende is aan de beurt.
let goudSinds = 0;
function goudAan() { cadeauEraf(); document.documentElement.classList.add('goud'); document.body.classList.add('goud'); goudSinds = Date.now(); }
document.addEventListener('click', () => {
  if (!document.body.classList.contains('goud') || Date.now() - goudSinds < 700) return; // niet per ongeluk meteen wegtikken
  document.documentElement.classList.remove('goud'); document.body.classList.remove('goud');
  if (cadeaus === 0) groenAan(); // het laatste cadeautje is gepakt: verder op het groene scherm
  if (namen.length) { beurt = (beurt + 1) % namen.length; toonBeurt(); }
  bezig = false;
});

// Zelf dobbelen: deze beurt gooit de speler met een echte dobbelsteen. VERDER = de volgende is aan de beurt, weer met de steen op het scherm.
document.getElementById('zelfKnop').addEventListener('click', () => { if (!bezig) document.body.classList.add('zelf'); });
document.getElementById('verder').addEventListener('click', () => {
  document.body.classList.remove('zelf');
  if (namen.length) { beurt = (beurt + 1) % namen.length; toonBeurt(); }
});
toon(5);
toonBeurt();

// Hoeveel cadeautjes er zijn (ingevuld bij de namen).
// Stap 11 (10 nov): bij een zes gaat er één cadeautje af (niet verder dan 0). Het nieuwe aantal wordt bewaard.
const CADEAU_SLEUTEL = 'deluxe-dobbelen-cadeaus';
let cadeaus = -1; // -1 = er is geen aantal ingevuld
try { const bewaard = localStorage.getItem(CADEAU_SLEUTEL); if (/^[0-9]{1,3}$/.test(bewaard || '')) cadeaus = parseInt(bewaard, 10); } catch (e) {}
function toonCadeaus() {
  document.getElementById('cadeauTeller').textContent = cadeaus < 0 ? '' : '🎁 ' + cadeaus + (cadeaus === 1 ? ' cadeautje' : ' cadeautjes');
}
function cadeauEraf() {
  if (cadeaus <= 0) return;
  cadeaus--;
  try { localStorage.setItem(CADEAU_SLEUTEL, String(cadeaus)); } catch (e) {}
  toonCadeaus();
}
toonCadeaus();

// Alle cadeautjes op: het scherm wordt groen. Het spel gaat gewoon door (steen, zelf dobbelen, goud bij een zes).
function groenAan() { document.documentElement.classList.add('groen'); document.body.classList.add('groen'); startTimer(); }

// Stap 14 (10 nov): zodra het scherm groen wordt, zet de site zelf een geheime timer: een toevallige tijd tussen 50 en 70 minuten.
// Het eindtijdstip wordt bewaard, zodat de timer doorloopt als je de pagina opnieuw opent. Je ziet hem nergens.
// Als de tijd om is gaat het alarm af (stap 15, zie alarmAf).
const TIMER_SLEUTEL = 'deluxe-dobbelen-eindtijd', TIMER_MIN = 50, TIMER_MAX = 70;

// Stap 15: het alarm. Een harde sirene (zelf gemaakt geluid), daarna zegt een stem de tekst; dat drie keer achter elkaar.
// Een tik op het scherm zet het alarm uit. Het gaat per timer maar één keer af (onthouden in ALARM_SLEUTEL).
// Een browser mag pas geluid maken nadat er op de pagina getikt is; daarom wordt het geluid bij de eerste tik "ontgrendeld".
const ALARM_SLEUTEL = 'deluxe-dobbelen-alarm-gedaan', ALARM_TEKST = 'Ho, ho, ho, ho! Veel cadeautjes hè! Fijne kerstfeest!';
const alarmVak = document.getElementById('alarm');
let geluid = null, alarmWachters = [], alarmToon = null;
function ontgrendel() {
  try { if (!geluid) geluid = new (window.AudioContext || window.webkitAudioContext)(); if (geluid.state === 'suspended') geluid.resume(); } catch (e) {}
}
document.addEventListener('pointerdown', ontgrendel, true);
function sirene(duur) {
  ontgrendel();
  if (!geluid) return;
  try {
    const t0 = geluid.currentTime, toon = geluid.createOscillator(), sterkte = geluid.createGain();
    toon.type = 'square';
    for (let t = 0, k = 0; t < duur; t += 0.22, k++) toon.frequency.setValueAtTime(k % 2 ? 660 : 990, t0 + t);
    sterkte.gain.setValueAtTime(0.0001, t0); sterkte.gain.linearRampToValueAtTime(0.9, t0 + 0.03);
    sterkte.gain.setValueAtTime(0.9, t0 + duur - 0.06); sterkte.gain.linearRampToValueAtTime(0.0001, t0 + duur);
    toon.connect(sterkte); sterkte.connect(geluid.destination);
    toon.start(t0); toon.stop(t0 + duur); alarmToon = toon;
  } catch (e) {}
}
function zeg() {
  try {
    if (!('speechSynthesis' in window)) return;
    const zin = new SpeechSynthesisUtterance(ALARM_TEKST);
    zin.lang = 'nl-NL'; zin.pitch = 0.5; zin.rate = 0.85; zin.volume = 1;
    const stem = speechSynthesis.getVoices().find((v) => /^nl/i.test(v.lang));
    if (stem) zin.voice = stem;
    speechSynthesis.speak(zin);
  } catch (e) {}
}
function alarmAf() {
  try { if (localStorage.getItem(ALARM_SLEUTEL) === String(eindtijd)) return; localStorage.setItem(ALARM_SLEUTEL, String(eindtijd)); } catch (e) {}
  alarmVak.classList.add('aan');
  for (let ronde = 0; ronde < 3; ronde++) {
    alarmWachters.push(setTimeout(() => sirene(2.4), ronde * 9000));
    alarmWachters.push(setTimeout(zeg, ronde * 9000 + 2500));
  }
}
function alarmUit() {
  alarmWachters.forEach(clearTimeout); alarmWachters = [];
  try { if (alarmToon) alarmToon.stop(); } catch (e) {}
  try { speechSynthesis.cancel(); } catch (e) {}
  alarmVak.classList.remove('aan');
}
alarmVak.addEventListener('click', (e) => { e.stopPropagation(); alarmUit(); });
let eindtijd = 0, timerWacht = 0;
function startTimer() {
  if (eindtijd) return; // loopt al
  try { const bewaard = parseInt(localStorage.getItem(TIMER_SLEUTEL) || '', 10); if (bewaard > 0) eindtijd = bewaard; } catch (e) {}
  if (!eindtijd) {
    const seconden = TIMER_MIN * 60 + Math.floor(Math.random() * ((TIMER_MAX - TIMER_MIN) * 60 + 1));
    eindtijd = Date.now() + seconden * 1000;
    try { localStorage.setItem(TIMER_SLEUTEL, String(eindtijd)); } catch (e) {}
  }
  const kijk = () => { if (Date.now() >= eindtijd) { document.body.dataset.tijd = 'om'; clearInterval(timerWacht); alarmAf(); } };
  timerWacht = setInterval(kijk, 1000); kijk();
}
if (cadeaus === 0) groenAan();
</script>
<script src="dobbelen-kerst.js"></script>
</body>
</html>
