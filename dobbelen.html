<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOBBELEN — Deluxe Edition</title>
<style>
  /* 🎲 DOBBELEN — stap 1 (10 nov 2026, Brian): je kunt namen invoeren. Het dobbelen zelf komt later.
     🎄 Kerstthema (10 nov, Brian): witte achtergrond met rood, groen en goud. Bewust niet het deluxeedition-thema. */
  :root { --rood: #c8102e; --donkerrood: #8f0b20; --groen: #146b3a; --donkergroen: #0c4a27; --goud: #c9a227; --lichtgoud: #f3e3a6; --inkt: #2a2a2a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: "Segoe UI", system-ui, sans-serif; color: var(--inkt); background: #ffffff; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 112px 16px 40px; position: relative; z-index: 2; }
  /* Kerstversiering (10 nov, Brian): slingers, hangende kerstballen en een kerstboom op de achtergrond. */
  #decor { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  #ballen { position: fixed; top: 0; left: 0; width: 100%; height: 0; z-index: 0; pointer-events: none; }
  #ballen .bal { position: absolute; top: 0; transform-origin: 50% 0; animation: wieg 4s ease-in-out infinite alternate; }
  @keyframes wieg { from { transform: rotate(-3.2deg); } to { transform: rotate(3.2deg); } }
  @media (prefers-reduced-motion: reduce) { #ballen .bal { animation: none; } }
  @media (max-width: 899px) { .wrap { background: linear-gradient(rgba(255,255,255,0) 0, rgba(255,255,255,0) 88px, rgba(255,255,255,.84) 112px); border-radius: 0 0 22px 22px; } }
  .terug { display: inline-block; color: var(--groen); text-decoration: none; font-weight: 700; font-size: 14px;
           border: 2px solid var(--groen); border-radius: 999px; padding: 7px 14px; }
  .terug:hover { background: var(--groen); color: #fff; }
  h1 { text-align: center; font-size: 40px; margin: 18px 0 2px; letter-spacing: 2px; color: var(--rood); }
  h1::after { content: ""; display: block; width: 120px; height: 4px; margin: 8px auto 0; border-radius: 4px; background: var(--goud); }
  .steen { text-align: center; font-size: 64px; line-height: 1; margin-top: 10px; }
  .uitleg { text-align: center; color: var(--donkergroen); margin: 10px 0 20px; font-size: 16px; font-weight: 600; }
  .invoer { display: flex; gap: 8px; }
  .invoer input { flex: 1; min-width: 0; font: inherit; font-size: 18px; padding: 13px 14px; border-radius: 14px;
                  border: 2px solid var(--goud); background: #fff; color: var(--inkt); outline: none; }
  .invoer input:focus { border-color: var(--groen); box-shadow: 0 0 0 3px rgba(20,107,58,.18); }
  .invoer input::placeholder { color: #9a9a9a; }
  .knop { font: inherit; font-size: 17px; font-weight: 800; color: #fff; border: 0; border-radius: 14px; padding: 13px 18px; cursor: pointer;
          background: var(--rood); box-shadow: 0 5px 0 var(--donkerrood); }
  .knop:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--donkerrood); }
  .melding { min-height: 22px; margin: 8px 2px 0; font-size: 14px; font-weight: 600; color: var(--rood); }
  .teller { margin: 18px 2px 8px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; color: var(--groen); }
  .lijst { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .lijst li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px;
              border: 2px solid var(--groen); background: #f3faf5; }
  .lijst li:nth-child(odd) { border-color: var(--rood); background: #fdf3f4; }
  .lijst .nr { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--goud); color: #fff; display: flex;
               align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
  .lijst .naam { flex: 1; min-width: 0; font-size: 18px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lijst .weg { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--rood); background: #fff;
                color: var(--rood); font-size: 16px; cursor: pointer; }
  .lijst .weg:hover { color: #fff; background: var(--rood); }
  .leeg { text-align: center; color: #6b6b6b; padding: 22px 10px; border: 2px dashed var(--goud); border-radius: 14px; background: #fffdf5; }
  .alles-weg { display: block; margin: 16px auto 0; background: transparent; border: 0; color: #6b6b6b; font: inherit;
               font-size: 14px; text-decoration: underline; cursor: pointer; }
  /* Stap 9 (10 nov, Brian): vóór het dobbelen moet je invullen hoeveel cadeautjes er zijn. */
  .cadeaus { margin-top: 26px; padding: 14px; border: 2px solid var(--goud); border-radius: 14px; background: #fffdf5;
             display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .cadeaus label { font-weight: 800; font-size: 17px; color: var(--donkergroen); }
  .cadeaus input { font: inherit; font-size: 22px; font-weight: 800; width: 110px; padding: 10px 12px; text-align: center; border-radius: 12px;
                   border: 2px solid var(--groen); background: #fff; color: var(--inkt); outline: none; }
  .cadeaus input:focus { box-shadow: 0 0 0 3px rgba(20,107,58,.18); }
  #cadeauMelding { text-align: center; }
  .dobbel-knop { display: block; width: fit-content; margin: 28px auto 0; padding: 16px 44px; font-size: 22px; letter-spacing: 2px; text-decoration: none; }
</style>
</head>
<body>
<div id="ballen" aria-hidden="true"></div>
<canvas id="decor" aria-hidden="true"></canvas>
<div class="wrap">
  <a class="terug" href="index.html">← deluxeedition.nl</a>
  <div class="steen">🎲</div>
  <h1>DOBBELEN</h1>
  <p class="uitleg">Wie doet er mee? Zet alle namen erin.</p>

  <div class="invoer">
    <input id="naamVak" type="text" maxlength="14" placeholder="Typ een naam…" autocomplete="off" enterkeyhint="done">
    <button class="knop" id="voegToe">＋ ERBIJ</button>
  </div>
  <div class="melding" id="melding"></div>

  <div class="teller" id="teller"></div>
  <ul class="lijst" id="lijst"></ul>
  <button class="alles-weg" id="allesWeg">alle namen weghalen</button>

  <div class="cadeaus">
    <label for="cadeauVak">🎁 Hoeveel cadeautjes zijn er?</label>
    <input id="cadeauVak" type="number" inputmode="numeric" min="1" max="999" step="1" placeholder="0" autocomplete="off">
  </div>
  <div class="melding" id="cadeauMelding"></div>
  <a class="knop dobbel-knop" id="dobbelKnop" href="dobbelen-spel.html">🎲 DOBBELEN</a>
</div>

<script>
// De namen worden bewaard op dit apparaat, zodat ze er de volgende keer nog staan.
const SLEUTEL = 'deluxe-dobbelen-namen';
const MAX_NAMEN = 20;
let namen = [];
try { namen = JSON.parse(localStorage.getItem(SLEUTEL) || '[]') || []; } catch (e) { namen = []; }
if (!Array.isArray(namen)) namen = [];

const vak = document.getElementById('naamVak'), lijst = document.getElementById('lijst');
const melding = document.getElementById('melding'), teller = document.getElementById('teller');

function bewaar() { try { localStorage.setItem(SLEUTEL, JSON.stringify(namen)); } catch (e) {} }

function teken() {
  lijst.innerHTML = '';
  teller.textContent = namen.length === 1 ? '1 speler' : namen.length + ' spelers';
  document.getElementById('allesWeg').style.display = namen.length ? '' : 'none';
  if (!namen.length) {
    const leeg = document.createElement('div');
    leeg.className = 'leeg'; leeg.textContent = 'Nog niemand. Typ hierboven de eerste naam!';
    lijst.appendChild(leeg);
    return;
  }
  namen.forEach((naam, i) => {
    const li = document.createElement('li');
    li.innerHTML = '<span class="nr"></span><span class="naam"></span><button class="weg" title="weghalen">✕</button>';
    li.querySelector('.nr').textContent = i + 1;
    li.querySelector('.naam').textContent = naam; // textContent: een naam kan nooit als code worden uitgevoerd
    li.querySelector('.weg').onclick = () => { namen.splice(i, 1); bewaar(); teken(); };
    lijst.appendChild(li);
  });
}

function voegToe() {
  const naam = vak.value.trim().replace(/\s+/g, ' ');
  melding.textContent = '';
  if (!naam) { melding.textContent = 'Typ eerst een naam.'; vak.focus(); return; }
  if (namen.length >= MAX_NAMEN) { melding.textContent = 'Er passen maximaal ' + MAX_NAMEN + ' namen in.'; return; }
  if (namen.some(n => n.toLowerCase() === naam.toLowerCase())) { melding.textContent = naam + ' staat er al in.'; vak.select(); return; }
  namen.push(naam);
  bewaar(); teken();
  vak.value = ''; vak.focus();
}

document.getElementById('voegToe').onclick = voegToe;
vak.addEventListener('keydown', e => { if (e.key === 'Enter') voegToe(); });
document.getElementById('allesWeg').onclick = () => { namen = []; bewaar(); teken(); vak.focus(); };

// Hoeveel cadeautjes er zijn: bewaard op dit apparaat. Zonder een aantal kun je niet gaan dobbelen.
const CADEAU_SLEUTEL = 'deluxe-dobbelen-cadeaus', MAX_CADEAUS = 999;
const cadeauVak = document.getElementById('cadeauVak'), cadeauMelding = document.getElementById('cadeauMelding');
function aantalCadeaus() {
  const tekst = cadeauVak.value.trim();
  if (!/^[0-9]{1,3}$/.test(tekst)) return 0;
  const n = parseInt(tekst, 10);
  return n >= 1 && n <= MAX_CADEAUS ? n : 0;
}
try { const eerder = parseInt(localStorage.getItem(CADEAU_SLEUTEL) || '', 10); if (eerder >= 1 && eerder <= MAX_CADEAUS) cadeauVak.value = eerder; } catch (e) {}
cadeauVak.addEventListener('input', () => {
  cadeauMelding.textContent = '';
  const n = aantalCadeaus();
  try { if (n) localStorage.setItem(CADEAU_SLEUTEL, String(n)); else localStorage.removeItem(CADEAU_SLEUTEL); } catch (e) {}
  // een nieuw aantal cadeautjes = een nieuw spel: de timer van het groene scherm begint dan ook opnieuw
  try { localStorage.removeItem('deluxe-dobbelen-eindtijd'); localStorage.removeItem('deluxe-dobbelen-alarm-gedaan'); } catch (e) {}
});
document.getElementById('dobbelKnop').addEventListener('click', (e) => {
  if (aantalCadeaus()) return;
  e.preventDefault();
  cadeauMelding.textContent = 'Vul eerst in hoeveel cadeautjes er zijn (1 tot ' + MAX_CADEAUS + ').';
  cadeauVak.focus();
});

teken();
</script>
<script src="dobbelen-kerst.js"></script>
</body>
</html>
